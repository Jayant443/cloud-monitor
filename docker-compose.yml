services:
  db:
    image: timescale/timescaledb:latest-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-metrics_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell or a .env file next to this compose file}
      POSTGRES_DB: ${POSTGRES_DB:-metrics}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metrics_user -d metrics"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://metrics_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell or a .env file next to this compose file}@db:5432/metrics
      API_KEY: ${API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your shell or a .env file next to this compose file}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-true}
      CORS_ORIGINS: ${EC2_HOST:-http://localhost},http://127.0.0.1,http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-${EC2_HOST:-http://localhost}:8000}
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      EC2_HOST: ${EC2_HOST:-http://localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
