services:
  db:
    image: timescale/timescaledb:latest-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloud_monitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloud_monitor_local}
      POSTGRES_DB: ${POSTGRES_DB:-cloud_monitor}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cloud_monitor}:${POSTGRES_PASSWORD:-cloud_monitor_local}@db:5432/${POSTGRES_DB:-cloud_monitor}
      JWT_SECRET: ${JWT_SECRET:-local-development-only-change-me}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  client_node_modules:
